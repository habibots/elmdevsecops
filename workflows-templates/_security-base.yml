name: _security-base
on:
  workflow_call:
    inputs:
      site-type:
        type: string
        required: true
        description: "static | next | astro-ssr"
      scan-containers:
        type: boolean
        default: false
      dast-target-url:
        type: string
        required: false
      semgrep-rulesets:
        type: string
        default: "p/owasp-top-ten p/javascript p/typescript"
      node-version:
        type: string
        default: "22"
      working-directory:
        type: string
        default: "."

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 - full history for gitleaks
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install Semgrep
        run: pip install --quiet semgrep
      - name: Run Semgrep
        working-directory: ${{ inputs.working-directory }}
        run: |
          semgrep --config="${{ inputs.semgrep-rulesets }}" \
                  --sarif --output semgrep.sarif \
                  --error || true
      - name: Upload SAST SARIF
        # Best-effort upload; private repos without GHAS will get 403, which
        # we tolerate. The findings are still surfaced as CI artifacts and
        # the severity-gate step below is what actually blocks the gate.
        uses: github/codeql-action/upload-sarif@53e96ec3b35fce51c141c0d6f0e31028a448722d # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: ${{ inputs.working-directory }}/semgrep.sarif
          category: semgrep
      - name: Upload SAST SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: ${{ inputs.working-directory }}/semgrep.sarif
          if-no-files-found: ignore
      - name: Gate on Critical/High Semgrep findings
        # Severity-gating per docs/security-policy.md §3:
        # block on Critical/High; log Medium/Low for triage.
        run: |
          set -euo pipefail
          SARIF="${{ inputs.working-directory }}/semgrep.sarif"
          if [[ ! -s "$SARIF" ]]; then
            echo "No semgrep.sarif produced; nothing to gate on."
            exit 0
          fi
          python3 - "$SARIF" <<'PY'
          import json, sys
          sarif = json.load(open(sys.argv[1]))
          # Semgrep encodes severity in result.properties.severity OR rule.defaultConfiguration.level.
          # Critical/High severities in Semgrep are reported as "ERROR" (high) in SARIF "level"
          # and "HIGH"/"CRITICAL" in properties.severity (newer versions).
          high = 0
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  sev = (result.get("properties", {}).get("severity") or "").upper()
                  level = (result.get("level") or "").lower()
                  if sev in ("HIGH", "CRITICAL", "ERROR") or level == "error":
                      high += 1
          print(f"Semgrep Critical/High findings: {high}")
          sys.exit(1 if high > 0 else 0)
          PY

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run OSV-Scanner
        # The action exits non-zero on ANY finding regardless of severity. We
        # capture but tolerate that exit, then gate ourselves on Critical/High
        # in the next step.
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-results.sarif
            --skip-git
            ./
      - name: Upload SCA SARIF
        uses: github/codeql-action/upload-sarif@53e96ec3b35fce51c141c0d6f0e31028a448722d # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
      - name: Upload SCA SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-scanner-sarif
          path: osv-results.sarif
          if-no-files-found: ignore
      - name: Gate on Critical/High SCA findings
        # Severity-gating per docs/security-policy.md §3:
        # only Critical/High block the merge gate; Medium/Low are surfaced
        # for triage but don't fail CI.
        run: |
          set -euo pipefail
          if [[ ! -s osv-results.sarif ]]; then
            echo "No osv-results.sarif produced; nothing to gate on."
            exit 0
          fi
          python3 - osv-results.sarif <<'PY'
          import json, sys
          sarif = json.load(open(sys.argv[1]))
          # OSV-Scanner SARIF encodes CVSS severity in:
          #   result.properties["security-severity"]  (numeric, CVSSv3)
          # OR rule.properties.tags / rule.defaultConfiguration.level.
          # CVSS 7.0+ == High, 9.0+ == Critical. Treat anything >= 7.0 as a gate failure.
          rules_by_id = {}
          for run in sarif.get("runs", []):
              for r in (run.get("tool", {}).get("driver", {}).get("rules", []) or []):
                  rules_by_id[r.get("id")] = r
          high = 0
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  sev_score = None
                  # Try result-level first, then rule-level.
                  for source in (result.get("properties", {}),
                                 (rules_by_id.get(result.get("ruleId"), {}) or {}).get("properties", {})):
                      val = source.get("security-severity")
                      if val is None: continue
                      try:
                          sev_score = float(val); break
                      except (TypeError, ValueError):
                          continue
                  if sev_score is not None and sev_score >= 7.0:
                      high += 1
          print(f"OSV-Scanner Critical/High findings: {high}")
          sys.exit(1 if high > 0 else 0)
          PY

  iac:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Checkov
        run: pip install --quiet checkov
      - name: Run Checkov
        run: |
          checkov --directory . \
                  --output sarif \
                  --output-file-path checkov-results.sarif \
                  --soft-fail || true
      - uses: github/codeql-action/upload-sarif@53e96ec3b35fce51c141c0d6f0e31028a448722d # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov-results.sarif
          category: checkov
      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv actionlint /usr/local/bin/
      - name: Run actionlint
        run: actionlint
      - uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          # Online audits hit the GitHub API to verify commit-SHA pin
          # provenance. They get rate-limited for unauthenticated callers
          # on free-tier runners and time out the job; offline audits still
          # cover the workflow-injection / unsafe-permission rules we care
          # about. Re-enable per-repo if GHAS / a richer token is available.
          online-audits: 'false'
          # Severity-gating per docs/security-policy.md §3: only High blocks
          # CI; Medium/Low surface for triage but don't fail the merge gate.
          min-severity: 'high'
        env:
          GH_TOKEN: ${{ github.token }}

  container:
    if: ${{ inputs.scan-containers }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build local image
        run: |
          # Try the working-directory's Dockerfile first, then fall back to common
          # infrastructure paths used by Pretix-style stacks.
          WD="${{ inputs.working-directory }}"
          if [[ -f "$WD/Dockerfile" ]]; then
            docker build -t local-image:scan "$WD"
          elif [[ -f infrastructure/docker/caddy/Dockerfile ]]; then
            docker build -t local-image:scan -f infrastructure/docker/caddy/Dockerfile infrastructure/docker/caddy/
          else
            echo "No Dockerfile found; skipping container scan"
            exit 0
          fi
      - name: Ensure .trivyignore exists (action requires file to be present)
        run: touch .trivyignore
      - uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561 # v0.20.0
        with:
          image-ref: local-image:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: 'true'
          # Honor `.trivyignore` at the repo root for justified allowlists.
          trivyignores: '.trivyignore'
      - uses: github/codeql-action/upload-sarif@53e96ec3b35fce51c141c0d6f0e31028a448722d # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Upload container SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install conftest
        run: |
          curl -fsSL -o /tmp/conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz
          tar xzf /tmp/conftest.tar.gz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/
          conftest --version
      - name: Verify policy unit tests pass
        if: hashFiles('policy/**/*.rego') != ''
        run: conftest verify policy/
      - name: Lint compose file (containers namespace)
        if: hashFiles('infrastructure/docker/docker-compose.yml') != ''
        run: conftest test infrastructure/docker/docker-compose.yml -p policy/ --namespace containers
      - name: Lint compose file (alt path)
        if: hashFiles('docker-compose.yml') != ''
        run: conftest test docker-compose.yml -p policy/ --namespace containers
      - name: Lint workflow files (github_actions namespace)
        if: hashFiles('.github/workflows/*.yml') != ''
        run: conftest test .github/workflows/*.yml -p policy/ --namespace github_actions

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: npm ci
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm run build --if-present
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          path: ${{ inputs.working-directory }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: ${{ inputs.working-directory }}/sbom.cdx.json

  gate:
    needs: [secrets, sast, sca, iac, policy, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gates passed
        run: |
          if [[ "${{ needs.secrets.result }}" != "success" ]]; then echo "FAIL: secrets"; exit 1; fi
          if [[ "${{ needs.sast.result }}" != "success" ]]; then echo "FAIL: sast"; exit 1; fi
          if [[ "${{ needs.sca.result }}" != "success" ]]; then echo "FAIL: sca"; exit 1; fi
          if [[ "${{ needs.iac.result }}" != "success" ]]; then echo "FAIL: iac"; exit 1; fi
          if [[ "${{ needs.policy.result }}" != "success" ]]; then echo "FAIL: policy"; exit 1; fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then echo "FAIL: build"; exit 1; fi
          echo "All gates passed."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: npm ci
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm run build --if-present
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          path: ${{ inputs.working-directory }}
      - name: Package release artifact
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [[ -d dist ]]; then tar -czf release.tar.gz dist
          elif [[ -d .next ]]; then tar -czf release.tar.gz .next
          elif [[ -d build ]]; then tar -czf release.tar.gz build
          elif [[ -d .open-next ]]; then tar -czf release.tar.gz .open-next
          else echo "No build output directory found"; exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Sign release artifact (keyless via Sigstore)
        working-directory: ${{ inputs.working-directory }}
        run: |
          cosign sign-blob --yes \
            --bundle release.cosign.bundle \
            release.tar.gz
      - name: Attach SLSA build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: ${{ inputs.working-directory }}/release.tar.gz
      - name: Publish release artifacts to GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            ${{ inputs.working-directory }}/release.tar.gz
            ${{ inputs.working-directory }}/sbom.cdx.json
            ${{ inputs.working-directory }}/release.cosign.bundle
